<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blottr | Settings</title>
  <style>
    body { font-family: Arial, sans-serif; background: {% if s.dark_mode %}#111827{% else %}#f4f6f8{% endif %}; color: {% if s.dark_mode %}#f9fafb{% else %}#111{% endif %}; margin: 0; }
    .card { max-width: 480px; margin: 40px auto; background: {% if s.dark_mode %}#1f2937{% else %}#fff{% endif %}; padding: 24px; border-radius: 8px; }
    label { display: block; margin-top: 14px; }
    button { margin-top: 18px; padding: 10px 18px; background: #1d4ed8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .ok { background: #dcfce7; color: #111; padding: 8px; border-radius: 4px; }
    nav a { margin-right: 12px; color: #60a5fa; }
  </style>
</head>
<body>
  <div class="card">
    <nav>
      <a href="{% url 'home:home' %}">Home</a>
      <a href="{% url 'user_profile:profile' %}">Profile</a>
      <a href="{% url 'login:logout' %}">Logout</a>
    </nav>
    <h2>Settings</h2>
    {% for m in messages %}<p class="ok">{{ m }}</p>{% endfor %}
    <form method="post">
      {% csrf_token %}
      <label><input type="checkbox" name="dark_mode" {% if s.dark_mode %}checked{% endif %}> Dark mode</label>
      <label><input type="checkbox" name="email_notifications" {% if s.email_notifications %}checked{% endif %}> Email notifications</label>
      <button type="submit">Save settings</button>
    </form>
  </div>
</body>
</html>
